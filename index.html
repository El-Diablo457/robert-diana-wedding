<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robert & Diana Wedding Invitation</title>

    <!-- Google Fonts for Luxury Aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Playfair+Display:ital,wght@0,500;0,700;1,400&display=swap" rel="stylesheet">

    <!-- External Stylesheet -->
    <link rel="stylesheet" href="assets/style.css">
    
    <style>
        /* Universal Reset & Warm Color Grading */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary-burgundy: #6b1414;
            --accent-gold: #c59b27;
            --soft-gold: #e5c158;
            --cream-bg: #fdfbf7;
            --card-bg: rgba(255, 255, 255, 0.92);
            --text-dark: #2c221e;
        }

        body {
            background-color: var(--cream-bg);
            color: var(--text-dark);
            font-family: 'Cormorant Garamond', serif;
            min-height: 100vh;
            width: 100vw;
            overflow-x: hidden;
        }

        /* Full-Screen Landing Cover */
        #landing {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #ffffff 0%, #f7f1e5 100%);
            z-index: 1000;
        }

        .welcome-box {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .landing-cover-img {
            max-width: 95vw;
            max-height: 82vh;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(107, 20, 20, 0.15);
            border: 1px solid rgba(197, 155, 39, 0.3);
        }

        .action-bar {
            position: absolute;
            bottom: 5vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1010;
        }

        /* Responsive Main Scroll Area (Scales smoothly to filling screen) */
        #invitationContent {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px 15px 60px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 35px;
        }

        .scroll-section {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .content-img {
            width: 100%;
            max-width: 900px;
            height: auto;
            display: block;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(197, 155, 39, 0.25);
        }

        /* Glassmorphism Content Cards (Venue, RSVP, Thank You) */
        .content-card {
            width: 100%;
            max-width: 650px;
            background: var(--card-bg);
            backdrop-filter: blur(8px);
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(107, 20, 20, 0.08);
            text-align: center;
            border: 1px solid rgba(197, 155, 39, 0.4);
            position: relative;
        }
