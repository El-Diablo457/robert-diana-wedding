<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#fdfbf7">
    <meta name="description" content="Robert and Diana Wedding Invitation">

    <title>Robert & Diana Wedding Invitation</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Playfair+Display:ital,wght@0,500;0,700;1,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="assets/style.css">

    <style>
        /* =================================
            UNIVERSAL RESPONSIVE SETTINGS
        ================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary-burgundy: #6b1414;
            --accent-gold: #c59b27;
            --soft-gold: #e5c158;
            --cream-bg: #fdfbf7;
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-dark: #2c221e;
        }

        html {
            width: 100%;
            min-height: 100%;
            scroll-behavior: smooth;
            overflow-x: clip;
        }

        body {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;

            background-color: var(--cream-bg);
            color: var(--text-dark);

            font-family: 'Cormorant Garamond', serif;

            overflow-x: clip;
        }

        /* Make all images responsive */

        img {
            display: block;
            max-width: 100%;
            height: auto;
        }

        /* =================================
            LANDING COVER (PINTEREST POP-UP MODAL)
        ================================= */

        #landing {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100vh;
            height: 100dvh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding:
                env(safe-area-inset-top)
                env(safe-area-inset-right)
                env(safe-area-inset-bottom)
                env(safe-area-inset-left);

            background: rgba(44, 34, 30, 0.55);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);

            z-index: 1000;
            cursor: pointer;
            padding: 20px;
        }

        .welcome-box {
            position: relative;

            width: 100%;
            max-width: 440px;

            background: var(--card-bg);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            padding: 20px 20px 20px;

            border-radius: 24px;

            box-shadow:
                0 25px 50px rgba(0, 0, 0, 0.3);

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            border: 1px solid rgba(197, 155, 39, 0.4);

            /* Entrance, Fast Glow, and Tilt Sway */
            transform-origin: center center;
            animation: 
                popUpScale 0.3s cubic-bezier(0.16, 1, 0.3, 1), 
                pulseGlow 1s ease-in-out infinite 0.3s, 
                tiltSway 1.33s ease-in-out infinite 0.3s;
        }

        /* Wavy Subsequent Ripple Layers */
        .welcome-box::before,
        .welcome-box::after {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 24px;
            pointer-events: none;
            z-index: -1;
        }

        /* First Wavy Ripple (Red / Burgundy) */
        .welcome-box::before {
            border: 1.5px solid rgba(107, 20, 20, 0.85);
            animation: wavyRippleRed 1.5s ease-in-out infinite 0.3s;
        }

        /* Second Subsequent Wavy Ripple (White) */
        .welcome-box::after {
            border: 1.5px solid rgba(255, 255, 255, 0.9);
            animation: wavyRippleWhite 1.5s ease-in-out infinite 0.6s;
        }

        @keyframes popUpScale {
            0% { transform: scale(0.85); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes pulseGlow {
            0% {
                box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            }
            50% {
                box-shadow: 0 30px 60px rgba(107, 20, 20, 0.5);
            }
            100% {
                box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            }
        }

        @keyframes tiltSway {
            0% {
                transform: scale(1) rotate(0deg);
            }
            25% {
                transform: scale(1.03) rotate(-2deg);
            }
            75% {
                transform: scale(1.03) rotate(2deg);
            }
            100% {
                transform: scale(1) rotate(0deg);
            }
        }

        /* Wavy Undulating Red Ripple */
        @keyframes wavyRippleRed {
            0% {
                transform: scale(1) skewX(0deg);
                border-radius: 24px;
                opacity: 0.9;
            }
            33% {
                transform: scale(1.12) skewX(1.5deg);
                border-radius: 28px 20px 28px 20px;
            }
            66% {
                transform: scale(1.22) skewX(-1.5deg);
                border-radius: 20px 28px 20px 28px;
            }
            100% {
                transform: scale(1.32) skewX(0deg);
                border-radius: 32px;
                opacity: 0;
            }
        }

        /* Wavy Undulating White Ripple */
        @keyframes wavyRippleWhite {
            0% {
                transform: scale(1) skewX(0deg);
                border-radius: 24px;
                opacity: 0.9;
            }
            33% {
                transform: scale(1.14) skewX(-1.5deg);
                border-radius: 20px 28px 20px 28px;
            }
            66% {
                transform: scale(1.24) skewX(1.5deg);
                border-radius: 28px 20px 28px 20px;
            }
            100% {
                transform: scale(1.35) skewX(0deg);
                border-radius: 32px;
                opacity: 0;
            }
        }

        .landing-cover-img {
            width: 100%;
            height: auto;

            max-height: 70vh;

            object-fit: contain;
            object-position: center;

            border-radius: 14px;

            box-shadow:
                0 8px 25px rgba(107, 20, 20, 0.15);

            border: 1px solid rgba(197, 155, 39, 0.3);
        }

        /* =================================
            BLURRED PREVIEW STATE FOR BACKGROUND
        ================================= */

        body.landing-active #invitationContent {
            display: flex !important;
            filter: blur(12px);
            -webkit-filter: blur(12px);
            opacity: 0.4;
            pointer-events: none;
            user-select: none;
            transition: filter 0.6s ease, opacity 0.6s ease;
        }

        /* =================================
            MAIN INVITATION CONTENT
        ================================= */

        #invitationContent {
            width: 100%;
            max-width: 1100px;

            margin: 0 auto;

            padding: clamp(12px, 3vw, 35px);

            display: flex;
            flex-direction: column;
            align-items: center;

            gap: clamp(20px, 4vw, 40px);
            transition: filter 0.6s ease, opacity 0.6s ease;
        }

        .scroll-section {
            width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* =================================
            RESPONSIVE CONTENT IMAGES
        ================================= */

        .content-img {
            display: block;

            width: auto;
            height: auto;

            max-width: 100%;
            max-height: none;

            object-fit: contain;
            object-position: center;

            border-radius: 12px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.08);

            border: 1px solid rgba(197, 155, 39, 0.25);
        }

        /* =================================
            CONTENT CARDS
        ================================= */

        .content-card {
            width: 100%;
            max-width: 650px;

            background: var(--card-bg);

            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);

            padding: clamp(20px, 5vw, 40px);

            border-radius: 16px;

            box-shadow:
                0 10px 30px rgba(107, 20, 20, 0.08);

            text-align: center;

            border: 1px solid rgba(197, 155, 39, 0.4);

            position: relative;

            overflow-wrap: anywhere;
        }

        .content-card h2 {
            font-family: 'Cinzel Decorative', serif;

            font-size: clamp(1.4rem, 5vw, 2.2rem);

            color: var(--primary-burgundy);

            margin-bottom: 15px;

            letter-spacing: 1px;
            line-height: 1.3;
        }

        .content-card h3 {
            font-family: 'Playfair Display', serif;

            font-size: clamp(1.15rem, 3.5vw, 1.5rem);

            font-weight: 600;

            margin: 12px 0;

            color: var(--text-dark);

            line-height: 1.4;
        }

        .content-card p {
            font-size: clamp(1rem, 3vw, 1.2rem);

            color: #4a3e3d;

            line-height: 1.6;
        }

        /* =================================
            RSVP FORM & PLUS ONE
        ================================= */

        .rsvp-form {
            display: flex;
            flex-direction: column;

            gap: 16px;

            margin-top: 25px;

            width: 100%;
            min-width: 0;
        }

        .rsvp-form input,
        .rsvp-form select,
        .rsvp-form textarea {

            width: 100%;
            max-width: 100%;
            min-width: 0;

            padding: 14px 18px;

            border: 1px solid #dcd1c4;
            border-radius: 8px;

            font-family: 'Cormorant Garamond', serif;

            font-size: 1.1rem;

            background: #fff;
            color: var(--text-dark);

            outline: none;

            transition: all 0.3s ease;
        }

        .rsvp-form input:focus,
        .rsvp-form select:focus,
        .rsvp-form textarea:focus {

            border-color: var(--accent-gold);

            box-shadow:
                0 0 8px rgba(197, 155, 39, 0.3);
        }
