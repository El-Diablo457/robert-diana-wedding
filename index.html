<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robert & Diana Wedding Invitation</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="assets/style.css">
    
    <style>
        /* Responsive Auto-Fitting Styles for Images and Sections */
        .scroll-section {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 0;
            box-sizing: border-box;
        }

        .content-img {
            width: 100%;
            max-width: 800px; /* Keeps images from becoming too wide on desktops */
            height: auto;
            display: block;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .landing-cover-img {
            width: 100%;
            max-width: 700px;
            height: auto;
            display: block;
            object-fit: contain;
        }

        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background-color: #faf6f0;
        }
    </style>
</head>

<body>

    <!-- Background Music -->
    <audio id="bgMusic" loop preload="auto">
        <source src="bahandi.m4a" type="audio/mp4">
        Your browser does not support the audio element.
    </audio>

    <!-- Hidden Lightbox Modal -->
    <div id="lightbox" class="lightbox-modal" style="display: none;">
        <span id="closeLightbox">&times;</span>
        <img id="lightboxImage" alt="Preview">
    </div>

    <!-- 1. Landing Page (Shown initially) -->
    <section id="landing" class="page active" style="min-height: 100vh; display: flex; justify-content: center; align-items: center;">
        <div class="welcome-box" style="text-align: center; width: 90%; max-width: 600px;">
            <img src="images/cover.png" alt="Robert & Diana Wedding" class="landing-cover-img">

            <div class="action-bar" style="margin-top: 25px;">
                <button class="open-btn" onclick="openInvitation()">
                    Open Invitation
                </button>
            </div>
        </div>
    </section>

    <!-- 2. Continuous Scrollable Content (Hidden until Open Invitation is clicked) -->
    <div id="invitationContent" class="invitation-scroll-container" style="display: none;">
        
        <!-- Invitation Image Section -->
        <section class="scroll-section">
            <img src="images/invitation.jfif" alt="Wedding Invitation" class="content-img">
        </section>

        <!-- Entourage Image Section -->
        <section class="scroll-section">
            <img src="images/entourage.png" alt="Wedding Entourage" class="content-img">
        </section>

        <!-- Venue Section -->
        <section class="scroll-section center-page">
            <div class="content-card" style="text-align: center; padding: 30px;">
                <h2>Wedding Venue</h2>
                <h3>Garden of Envy Indoor Garden</h3>
                <p>The Gallery Mabolo, Cebu City</p>

                <a class="venue-btn" href="https://maps.app.goo.gl/cvZW7dEifomMjG9T9" target="_blank">
                    Open Google Maps
                </a>
            </div>
        </section>

        <!-- Gallery Section -->
        <section class="scroll-section center-page" style="flex-direction: column;">
            <h2>Wedding Gallery</h2>
            <div class="gallery" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; width: 90%; max-width: 900px;">
                <img src="images/cover.png" alt="Gallery 1" style="width: 100%; max-width: 250px; height: auto; cursor: pointer; border-radius: 6px;" onclick="openLightbox(this)">
                <img src="images/invitation.jfif" alt="Gallery 2" style="width: 100%; max-width: 250px; height: auto; cursor: pointer; border-radius: 6px;" onclick="openLightbox(this)">
                <img src="images/entourage.png" alt="Gallery 3" style="width: 100%; max-width: 250px; height: auto; cursor: pointer; border-radius: 6px;" onclick="openLightbox(this)">
            </div>
        </section>

        <!-- RSVP Section -->
        <section class="scroll-section center-page">
            <div class="content-card" style="text-align: center; padding: 30px; width: 100%; max-width: 500px;">
                <h2>RSVP</h2>

                <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 15px;">
                    <input id="rsvpName" placeholder="Guest Name" style="padding: 10px; width: 100%; box-sizing: border-box;">
                    <input id="rsvpMobile" placeholder="Mobile Number" style="padding: 10px; width: 100%; box-sizing: border-box;">

                    <select id="attendance" style="padding: 10px; width: 100%; box-sizing: border-box;">
                        <option>Attending</option>
                        <option>Not Attending</option>
                    </select>

                    <input id="guestCount" type="number" value="1" min="1" style="padding: 10px; width: 100%; box-sizing: border-box;">

                    <textarea id="message" placeholder="Message" style="padding: 10px; width: 100%; height: 80px; box-sizing: border-box;"></textarea>

                    <button class="submit-btn" onclick="submitRSVP()" style="padding: 12px; cursor: pointer;">
                        Confirm Attendance
                    </button>
                </div>
            </div>
        </section>

        <!-- Thank You Section -->
        <section class="scroll-section center-page" style="padding-bottom: 60px;">
            <div class="content-card" style="text-align: center; padding: 30px;">
                <h2>Thank You</h2>
                <h1 id="thankYouName"></h1>
                <p>Your attendance has been confirmed.</p>
                <p>We look forward to celebrating our special day with you.</p>
            </div>
        </section>

    </div>

    <!-- Application Script -->
    <script src="assets/app.js"></script>

</body>
</html>
