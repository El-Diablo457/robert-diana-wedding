<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robert & Diana Wedding Invitation</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- External Stylesheet -->
    <link rel="stylesheet" href="assets/style.css">
    
    <style>
        /* Universal Mobile & PC Responsive Optimization */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            background-color: #faf6f0;
            font-family: 'Cormorant Garamond', serif;
        }

        /* Fullscreen Landing Page */
        #landing {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #faf6f0;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        .welcome-box {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .landing-cover-img {
            max-width: 100%;
            max-height: 80vh;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }

        .action-bar {
            position: absolute;
            bottom: 6vh;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            display: flex;
            justify-content: center;
            z-index: 1010;
        }

        /* Scrollable Invitation Container */
        #invitationContent {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .scroll-section {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .content-img {
            width: 100%;
            max-width: 750px;
            height: auto;
            display: block;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* Content Cards (Venue, RSVP, Thank You) */
        .content-card {
            width: 100%;
            max-width: 550px;
            background: #ffffff;
            padding: 30px 25px;
            border-radius: 12px;
            box-shadow: 0 6px 25px rgba(0,0,0,0.08);
            text-align: center;
            border: 1px solid #ebdccb;
        }

        .content-card h2 {
            font-family: 'Great Vibes', cursive;
            font-size: 2.5rem;
            color: #7a1c1c;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .content-card h3 {
            font-size: 1.3rem;
            font-weight: 600;
            margin: 10px 0;
            color: #333;
        }

        .content-card p {
            font-size: 1.1rem;
            color: #555;
            line-height: 1.5;
            margin: 8px 0;
        }

        /* Form Inputs & Buttons */
        .rsvp-form {
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-top: 20px;
            width: 100%;
        }

        .rsvp-form input, 
        .rsvp-form select, 
        .rsvp-form textarea {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }

        .rsvp-form input:focus, 
        .rsvp-form select:focus, 
        .rsvp-form textarea:focus {
            border-color: #7a1c1c;
        }

        .rsvp-form textarea {
            resize: vertical;
            height: 90px;
        }

        /* Buttons Styling */
        .open-btn, .submit-btn, .venue-btn {
            background: linear-gradient(135deg, #7a1c1c, #a32a2a);
            color: #ffffff;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 14px 32px;
            border: 1px solid #d4af37;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(122, 28, 28, 0.3);
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .open-btn:hover, .submit-btn:hover, .venue-btn:hover {
            background: linear-gradient(135deg, #a32a2a, #7a1c1c);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(122, 28, 28, 0.4);
        }

        .venue-btn {
            margin-top: 15px;
            padding: 12px 24px;
            font-size: 1rem;
        }

        /* Mobile Screen Adjustments */
        @media screen and (max-width: 600px) {
            .landing-cover-img {
                max-height: 75vh;
            }
            .content-card {
                padding: 20px 15px;
                width: 92%;
            }
            #invitationContent {
                padding: 15px 5px;
                gap: 20px;
            }
        }
    </style>
</head>

<body>

    <!-- Background Music -->
    <audio id="bgMusic" loop preload="auto">
        <source src="bahandi.m4a" type="audio/mp4">
        Your browser does not support the audio element.
    </audio>

    <!-- 1. Landing Page (Shown initially) -->
    <section id="landing">
        <div class="welcome-box">
            <img src="images/cover.png" alt="Robert & Diana Wedding" class="landing-cover-img">

            <div class="action-bar">
                <button class="open-btn" onclick="openInvitation()">
                    Open Invitation
                </button>
            </div>
        </div>
    </section>

    <!-- 2. Continuous Scrollable Content (Hidden until Open Invitation is clicked) -->
    <div id="invitationContent" style="display: none;">
        
        <!-- Invitation Image Section -->
        <section class="scroll-section">
            <img src="images/invitation.jfif" alt="Wedding Invitation" class="content-img">
        </section>

        <!-- Entourage Image Section -->
        <section class="scroll-section">
            <img src="images/entourage.png" alt="Wedding Entourage" class="content-img">
        </section>

        <!-- Venue Section -->
        <section class="scroll-section">
            <div class="content-card">
                <h2>Wedding Venue</h2>
                <h3>Garden of Envy Indoor Garden</h3>
                <p>The Gallery Mabolo, Cebu City</p>

                <a class="venue-btn" href="https://maps.app.goo.gl/cvZW7dEifomMjG9T9" target="_blank">
                    Open Google Maps
                </a>
            </div>
        </section>

        <!-- RSVP Section -->
        <section class="scroll-section">
            <div class="content-card">
                <h2>RSVP</h2>
                <p style="font-size: 0.95rem; margin-bottom: 5px;">Kindly respond by confirming your attendance.</p>

                <div class="rsvp-form">
                    <input id="rsvpName" placeholder="Guest Name">
                    <input id="rsvpMobile" placeholder="Mobile Number">

                    <select id="attendance">
                        <option>Attending</option>
                        <option>Not Attending</option>
                    </select>

                    <input id="guestCount" type="number" value="1" min="1">

                    <textarea id="message" placeholder="Well wishes or message for the couple..."></textarea>

                    <button class="submit-btn" onclick="submitRSVP()">
                        Confirm Attendance
                    </button>
                </div>
            </div>
        </section>

        <!-- Thank You Section -->
        <section class="scroll-section" style="padding-bottom: 50px;">
            <div class="content-card">
                <h2>Thank You</h2>
                <h1 id="thankYouName" style="font-size: 1.5rem; color: #7a1c1c; margin: 10px 0;"></h1>
                <p>Your attendance has been confirmed.</p>
                <p>We look forward to celebrating our special day with you.</p>
            </div>
        </section>

    </div>

    <!-- Application Script -->
    <script src="assets/app.js"></script>

</body>
</html>
