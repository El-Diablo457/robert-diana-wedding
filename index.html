<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robert & Diana Wedding Invitation</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="assets/style.css">
</head>

<body>

    <!-- Background Music -->
    <audio id="bgMusic" loop preload="auto">
        <source src="bahandi.m4a" type="audio/mp4">
        Your browser does not support the audio element.
    </audio>

    <!-- Hidden Lightbox Modal -->
    <div id="lightbox" class="lightbox-modal" style="display: none;">
        <span id="closeLightbox">&times;</span>
        <img id="lightboxImage" alt="Preview">
    </div>

    <!-- 1. Landing Page (Shown initially) -->
    <section id="landing" class="page active">
        <div class="welcome-box">
            <img src="images/cover.png" alt="Robert & Diana Wedding" class="landing-cover-img">

            <div class="action-bar">
                <button class="open-btn" onclick="openInvitation()">
                    Open Invitation
                </button>
            </div>
        </div>
    </section>

    <!-- 2. Continuous Scrollable Content (Hidden until Open Invitation is clicked) -->
    <div id="invitationContent" class="invitation-scroll-container" style="display: none;">
        
        <!-- Cover Section -->
        <section class="scroll-section">
            <img src="images/cover.png" alt="Cover" class="content-img">
        </section>

        <!-- Invitation Image Section -->
        <section class="scroll-section">
            <img src="images/invitation.jfif" alt="Wedding Invitation" class="content-img">
        </section>

        <!-- Entourage Image Section -->
        <section class="scroll-section">
            <img src="images/entourage.png" alt="Wedding Entourage" class="content-img">
        </section>

        <!-- Venue Section -->
        <section class="scroll-section center-page">
            <div class="content-card">
                <h2>Wedding Venue</h2>
                <h3>Garden of Envy Indoor Garden</h3>
                <p>The Gallery Mabolo, Cebu City</p>

                <a class="venue-btn" href="https://maps.app.goo.gl/cvZW7dEifomMjG9T9" target="_blank">
                    Open Google Maps
                </a>
            </div>
        </section>

        <!-- Gallery Section -->
        <section class="scroll-section center-page">
            <h2>Wedding Gallery</h2>
            <div class="gallery">
                <img src="images/cover.png" alt="Gallery 1" onclick="openLightbox(this)">
                <img src="images/invitation.jfif" alt="Gallery 2" onclick="openLightbox(this)">
                <img src="images/entourage.png" alt="Gallery 3" onclick="openLightbox(this)">
            </div>
        </section>

        <!-- RSVP Section -->
        <section class="scroll-section center-page">
            <div class="content-card">
                <h2>RSVP</h2>

                <input id="rsvpName" placeholder="Guest Name">
                <input id="rsvpMobile" placeholder="Mobile Number">

                <select id="attendance">
                    <option>Attending</option>
                    <option>Not Attending</option>
                </select>

                <input id="guestCount" type="number" value="1" min="1">

                <textarea id="message" placeholder="Message"></textarea>

                <button class="submit-btn" onclick="submitRSVP()">
                    Confirm Attendance
                </button>
            </div>
        </section>

        <!-- Thank You Section -->
        <section class="scroll-section center-page">
            <div class="content-card">
                <h2>Thank You</h2>
                <h1 id="thankYouName"></h1>
                <p>Your attendance has been confirmed.</p>
                <p>We look forward to celebrating our special day with you.</p>
            </div>
        </section>

    </div>

    <!-- Application Script -->
    <script src="assets/app.js"></script>

</body>
</html>
