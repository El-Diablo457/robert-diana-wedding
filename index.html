<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robert & Diana Wedding Invitation</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="assets/style.css">
</head>

<body>

    <!-- Background Music -->
    <audio id="bgMusic" loop preload="auto">
        <source src="bahandi.m4a" type="audio/mp4">
        Your browser does not support the audio element.
    </audio>

    <!-- Hidden Lightbox Modal -->
    <div id="lightbox" class="lightbox-modal" style="display: none;">
        <span id="closeLightbox">&times;</span>
        <img id="lightboxImage" alt="Preview">
    </div>

    <!-- Landing Page (Only this shows initially) -->
    <section id="landing" class="page active">
        <div class="welcome-box">
            <img src="images/cover.png" alt="Robert & Diana Wedding" class="landing-cover-img">

            <div class="action-bar">
                <button class="open-btn" onclick="openInvitation()">
                    Open Invitation
                </button>
            </div>
        </div>
    </section>

    <!-- Cover Page (Unlocked after clicking Open Invitation) -->
    <section id="cover" class="page">
        <img src="images/cover.png" alt="Cover Background" class="bg-img">

        <div class="overlay-card">
            <h1 id="typedName"></h1>
            <p id="guestGreeting"></p>
            <div id="countdown"></div>
            <button class="nav-btn" onclick="showPage('invitation')">
                View Invitation
            </button>
        </div>
    </section>

    <!-- Invitation Page -->
    <section id="invitation" class="page image-page">
        <img src="images/invitation.jfif" alt="Wedding Invitation">

        <button class="next-btn" onclick="showPage('entourage')">
            Next →
        </button>
    </section>

    <!-- Entourage Page -->
    <section id="entourage" class="page image-page">
        <img src="images/entourage.png" alt="Wedding Entourage">

        <button class="next-btn" onclick="showPage('venue')">
            Next →
        </button>
    </section>

    <!-- Venue Page -->
    <section id="venue" class="page center-page">
        <div class="content-card">
            <h2>Wedding Venue</h2>
            <h3>Garden of Envy Indoor Garden</h3>
            <p>The Gallery Mabolo, Cebu City</p>

            <a class="venue-btn" href="https://maps.app.goo.gl/cvZW7dEifomMjG9T9" target="_blank">
                Open Google Maps
            </a>
        </div>

        <button class="next-btn" onclick="showPage('gallery')">
            Next →
        </button>
    </section>

    <!-- Gallery Page -->
    <section id="gallery" class="page center-page">
        <h2>Wedding Gallery</h2>

        <div class="gallery">
            <img src="images/cover.png" alt="Gallery 1" onclick="openLightbox(this)">
            <img src="images/invitation.jfif" alt="Gallery 2" onclick="openLightbox(this)">
            <img src="images/entourage.png" alt="Gallery 3" onclick="openLightbox(this)">
        </div>

        <button class="next-btn" onclick="showPage('rsvp')">
            Next →
        </button>
    </section>

    <!-- RSVP Page -->
    <section id="rsvp" class="page center-page">
        <div class="content-card">
            <h2>RSVP</h2>

            <input id="rsvpName" placeholder="Guest Name">
            <input id="rsvpMobile" placeholder="Mobile Number">

            <select id="attendance">
                <option>Attending</option>
                <option>Not Attending</option>
            </select>

            <input id="guestCount" type="number" value="1" min="1">

            <textarea id="message" placeholder="Message"></textarea>

            <button class="submit-btn" onclick="submitRSVP()">
                Confirm Attendance
            </button>
        </div>
    </section>

    <!-- Thank You Page -->
    <section id="thanks" class="page center-page">
        <div class="content-card">
            <h2>Thank You</h2>
            <h1 id="thankYouName"></h1>
            <p>Your attendance has been confirmed.</p>
            <p>We look forward to celebrating our special day with you.</p>
        </div>
    </section>

    <!-- Application Script -->
    <script src="assets/app.js"></script>

</body>
</html>
